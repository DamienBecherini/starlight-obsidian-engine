name: Build des vaults réels

# Le CI ordinaire construit le site sur un vault de test minimal. Ce workflow clone les vrais vaults et
# fait un build complet : il détecte les régressions du chargeur sur du contenu réel (wiki-links, callouts,
# MDX de splash, exclusions). Trop lent pour chaque push : hebdomadaire, à la demande, et sur main.
#
# Seuls les vaults publics sont listés. Pour un vault privé, il faudrait un jeton personnel en lecture
# (secret) passé au checkout ; le vault craft a été retiré volontairement (peu utilisé, liens en chantier).
on:
  workflow_dispatch:
  schedule:
    # Tous les lundis à 06:00 UTC.
    - cron: "0 6 * * 1"
  push:
    branches: [main]

concurrency:
  group: vaults-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  construire:
    name: Build ${{ matrix.vault }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Un vault en échec n'empêche pas de connaître le verdict des autres.
      fail-fast: false
      matrix:
        include:
          - vault: ia-on-prem
            repository: DamienBecherini/ia-on-prem-vault
    steps:
      - name: Récupérer le moteur
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: engine

      - name: Récupérer le vault
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          path: vault

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Installer les dépendances
        working-directory: engine
        run: npm ci --ignore-scripts

      # En avertissement seulement : ce workflow surveille le moteur, pas le contenu. Les liens cassés
      # d'un vault relèvent de son propre CI ; ici ils ne doivent pas masquer le verdict du build.
      - name: Auditer les wiki-links (informatif)
        working-directory: engine
        env:
          VAULT_PATH: ${{ github.workspace }}/vault
          FORCE_VAULT_PATH: "1"
        run: npm run audit:links -- --warn-only

      - name: Build complet
        working-directory: engine
        env:
          VAULT_PATH: ${{ github.workspace }}/vault
          FORCE_VAULT_PATH: "1"
        run: npm run build
