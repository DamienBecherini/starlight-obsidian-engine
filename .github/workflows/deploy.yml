name: Déploiement

# Déploie un vault depuis GitHub, à la main : build du moteur avec le vault choisi, puis envoi FTPS/SFTP
# complet vers l'hébergeur (équivalent de `npm run deploy:<vault> -- --full --yes` en local).
#
# Prérequis, une fois par vault, dans Settings → Environments : un environnement portant le nom du vault
# (ia-on-prem, craft) avec les secrets lus par scripts/lib/deploy.mjs :
#   DEPLOY_PROTOCOL (ftps | sftp), DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER, DEPLOY_REMOTE_PATH,
#   DEPLOY_PASSWORD, et au besoin DEPLOY_FTPS_INSECURE, DEPLOY_PROTECT.
# Authentification par mot de passe seulement : une clé SFTP supposerait un fichier sur la machine jetable.
# Le vault cloné n'a pas de .env : le moteur lit ces variables directement dans l'environnement.
# Vault privé : secret VAULT_TOKEN (jeton personnel en lecture) au niveau du dépôt.
on:
  workflow_dispatch:
    inputs:
      vault:
        description: "Vault à déployer"
        type: choice
        required: true
        options:
          - ia-on-prem
          - craft
      miroir:
        description: "Supprimer les fichiers distants absents du build (mirror)"
        type: boolean
        default: true

# Deux déploiements du même vault ne se chevauchent pas ; celui en cours va jusqu'au bout.
concurrency:
  group: deploy-${{ inputs.vault }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployer:
    name: Déployer ${{ inputs.vault }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Les secrets FTPS/SFTP sont ceux de l'environnement portant le nom du vault.
    environment: ${{ inputs.vault }}
    steps:
      - name: Récupérer le moteur
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: engine

      - name: Récupérer le vault
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DamienBecherini/${{ inputs.vault == 'craft' && 'software-craft-vault' || 'ia-on-prem-vault' }}
          token: ${{ secrets.VAULT_TOKEN || github.token }}
          path: vault

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Installer les dépendances
        working-directory: engine
        run: npm ci --ignore-scripts

      - name: Tests
        working-directory: engine
        run: npm test

      # --full : pas de manifeste incrémental sur une machine jetable, tout est renvoyé.
      # --yes : aucune confirmation interactive.
      - name: Build et envoi vers l'hébergeur
        working-directory: engine
        env:
          VAULT_PATH: ${{ github.workspace }}/vault
          FORCE_VAULT_PATH: "1"
          DEPLOY_PROTOCOL: ${{ secrets.DEPLOY_PROTOCOL }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_REMOTE_PATH: ${{ secrets.DEPLOY_REMOTE_PATH }}
          DEPLOY_FTPS_INSECURE: ${{ secrets.DEPLOY_FTPS_INSECURE }}
          DEPLOY_PROTECT: ${{ secrets.DEPLOY_PROTECT }}
        run: npm run deploy -- --full --yes ${{ inputs.miroir && '' || '--no-mirror' }}
